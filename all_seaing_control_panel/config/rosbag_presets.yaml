# Rosbag recording presets (control panel, Run tab -> "Rosbag recording").
# Imported from the scripts in all_seaing_bringup/rosbag_record/ (`source`); edited, copied and
# created from the panel, which rewrites this file (comments other than this header are not kept).
# A recording runs on the target as:
#   ros2 bag record -o <target bags path>/<prefix>_<MM_DD__HH_MM_SS> <topics...>   (or --all)
# Fields: id, title, prefix (bag folder name prefix), all_topics (record everything), topics,
#         source (the script it was imported from, if any).
